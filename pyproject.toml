[project]
name = "umineko-llm-sae-bias"
version = "0.1.0"
description = "Reconstruction error of Qwen-Scope SAEs on BF16 Qwen3.5-27B"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0.0",
    "bitsandbytes>=0.46.0",
    "datasets>=3.0.0",
    "einops>=0.8.0",
    "huggingface_hub>=0.26.0",
    "kernels>=0.10.0",
    "numpy>=2.0.0",
    "safetensors>=0.4.0",
    "torch==2.12.0",
    "tqdm>=4.66.0",
    "transformers>=5.2.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "reconstruction_error/src"}

[tool.setuptools.packages.find]
where = ["reconstruction_error/src"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
